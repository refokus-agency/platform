# AI code review on pull requests — posts inline comments and a summary, no deploy.
# Copy to .github/workflows/pr-code-review.yml in your repo.
#
# No actor guard needed. The reusable skips green on both fronts by itself: pull requests with
# no Anthropic credential reachable (Dependabot, forks) and pull requests opened by a bot
# (release-please, Renovate). Pass `with: allowed-bots: <name>` to review a bot's PRs anyway.

name: Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: read
  # id-token: write is MANDATORY, not optional. claude-code-action exchanges this
  # workflow's GitHub OIDC token for a GitHub App token — without it the action
  # cannot authenticate and the run fails. The reusable cannot detect the omission
  # from the inside, so it has to be granted here.
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  code-review:
    uses: refokus-agency/platform/.github/workflows/code-review.yml@v1
    secrets: inherit
