# yaml-language-server: $schema=https://raw.githubusercontent.com/suzuki-shunsuke/pinact/main/json-schema/pinact.json
#
# Scope pinact to this repo's own CI surface only.
#
# examples/ is deliberately excluded: those files are caller templates that
# downstream repos copy, and their `refokus-agency/platform/...@v1` references
# are first-party floating refs we intentionally keep floating (see
# docs/architecture.md -> "Why are third-party actions pinned by SHA?").
# Pinning them here would break the templates for every consumer repo.
version: 3

files:
  - pattern: .github/workflows/*.yml
  - pattern: .github/workflows/*.yaml
  - pattern: .github/actions/*/action.yml
  - pattern: .github/actions/*/action.yaml
