name: Deploy to Vercel (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: Vercel environment — preview | stage | production. Not required when transferred is true.
        required: false
        type: string
      node-version:
        description: Node version.
        required: false
        type: string
        default: '24'
      package-manager:
        description: Explicit override for package manager (pnpm | npm | bun). Auto-detected by lockfile if empty.
        required: false
        type: string
        default: ''
      pnpm-version:
        description: |
          pnpm version, used only when the package manager is pnpm. Leave empty
          (the default) to use the version package.json declares
          (devEngines.packageManager or packageManager), falling back to pnpm 10
          when it declares none. When set, it must match packageManager exactly:
          '11' against 'pnpm@11.17.0' fails with "Multiple versions of pnpm specified".
          Only packageManager is checked: against devEngines.packageManager an
          explicit value wins with no error, so leave it empty.
        required: false
        type: string
        default: ''
      bun-version:
        description: bun version, used only when the package manager is bun.
        required: false
        type: string
        default: 'latest'
      platform-ref:
        description: Ref of the platform repo to checkout for composite actions.
        required: false
        type: string
        default: main
      transferred:
        description: |
          Set to true when this repo has been handed off to a client's Vercel team. The deploy
          job logs a skip notice and exits 0 without invoking Vercel — no failed runs, no noise.
          Default false. Only the deploy is skipped; CI (lint/typecheck/test/build) is unaffected.
        required: false
        type: boolean
        default: false
      unsafe-install-scripts:
        description: |
          DANGEROUS — setting to true lets dependencies run postinstall scripts. A compromised
          dependency can exfiltrate secrets. Default false. Only enable if your project needs
          postinstall (native modules like sharp, bcrypt, puppeteer).
        required: false
        type: boolean
        default: false
      submodules:
        description: |
          Checkout git submodules. Set to true if your repo has submodules (e.g. a shared code
          submodule). Requires CHECKOUT_TOKEN if any submodule points at a private repo other
          than the caller's own — the default GITHUB_TOKEN can't read across repos.
        required: false
        type: boolean
        default: false
    secrets:
      # required: false so a transferred repo (whose Vercel secrets may be stale or removed)
      # can still call this reusable — the deploy steps are skipped when transferred is true.
      VERCEL_TOKEN:
        required: false
      VERCEL_ORG_ID:
        required: false
      VERCEL_PROJECT_ID:
        required: false
      CHECKOUT_TOKEN:
        description: |
          Token used to checkout the caller repo and its submodules. Only needed when
          submodules is true and a submodule points at a different private repo. Falls back
          to the default GITHUB_TOKEN when not provided.
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # No explicit permissions block on purpose: the job inherits the caller's
    # granted permissions. Declaring a scope here (e.g. `deployments: write`)
    # would force EVERY caller to grant it or the run fails at startup. By
    # inheriting, the "Start/Finish GitHub deployment" steps below decide per
    # environment: preview requires `deployments: write` (the start step fails
    # without it, before the build); stage/production stay opt-in and only
    # warn. Callers also need `contents: read` (checkout) and
    # `pull-requests: write` (PR comment); see examples/*.yml.
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Transferred repo — skip deploy
        if: ${{ inputs.transferred }}
        run: |
          echo "[deploy] skipped: repo marked as transferred"
        shell: bash

      - name: Validate environment input
        if: ${{ !inputs.transferred }}
        run: |
          case "${{ inputs.environment }}" in
            preview|stage|production) ;;
            *) echo "::error::environment must be preview, stage, or production (got: ${{ inputs.environment }})"; exit 1 ;;
          esac
        shell: bash

      - name: Checkout caller repo
        if: ${{ !inputs.transferred }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: ${{ inputs.submodules }}
          token: ${{ secrets.CHECKOUT_TOKEN || github.token }}

      - name: Checkout platform repo (for composite actions)
        if: ${{ !inputs.transferred }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: refokus-agency/platform
          ref: ${{ inputs.platform-ref }}
          path: .platform

      - name: Start GitHub deployment
        id: gh-deployment
        if: ${{ !inputs.transferred }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          # On pull_request, github.sha is the merge commit; the deployment is
          # recorded against the PR head so it can be looked up by that SHA.
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # Stage/production record the branch, as before this step existed.
          REF_NAME: ${{ github.ref_name }}
        with:
          script: |
            let start;
            try {
              ({ start } = require('./.platform/.github/scripts/github-deployment.cjs'));
            } catch (error) {
              // `platform-ref` points at a ref older than this script. Same
              // rule as onApiError(): preview fails, stage/production warn.
              const message = `Could not load github-deployment.cjs from platform-ref: ${error.message}`;
              if (process.env.ENVIRONMENT === 'preview') core.setFailed(message);
              else core.warning(message);
              return;
            }
            await start({ github, context, core });

      - name: Configure npm for GitHub Packages
        if: ${{ !inputs.transferred }}
        run: |
          echo "@refokus-agency:registry=https://npm.pkg.github.com" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc
        shell: bash

      - name: Setup
        id: setup
        if: ${{ !inputs.transferred }}
        uses: ./.platform/.github/actions/setup
        with:
          node-version: ${{ inputs.node-version }}
          package-manager: ${{ inputs.package-manager }}
          pnpm-version: ${{ inputs.pnpm-version }}
          bun-version: ${{ inputs.bun-version }}
          unsafe-install-scripts: ${{ inputs.unsafe-install-scripts }}

      - name: Map environment to Vercel flags
        id: vercel
        if: ${{ !inputs.transferred }}
        shell: bash
        run: |
          case "${{ inputs.environment }}" in
            production)
              echo "pull-env=production" >> "$GITHUB_OUTPUT"
              echo "build-flag=--prod" >> "$GITHUB_OUTPUT"
              echo "deploy-flag=--prod" >> "$GITHUB_OUTPUT"
              ;;
            stage|preview)
              echo "pull-env=preview" >> "$GITHUB_OUTPUT"
              echo "build-flag=" >> "$GITHUB_OUTPUT"
              echo "deploy-flag=" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Install Vercel CLI
        if: ${{ !inputs.transferred }}
        run: npm install -g vercel@latest
        shell: bash

      - name: Vercel pull
        if: ${{ !inputs.transferred }}
        run: vercel pull --yes --environment=${{ steps.vercel.outputs.pull-env }} --token=${{ secrets.VERCEL_TOKEN }}
        shell: bash

      - name: Vercel build
        if: ${{ !inputs.transferred }}
        run: vercel build ${{ steps.vercel.outputs.build-flag }} --token=${{ secrets.VERCEL_TOKEN }}
        shell: bash

      - name: Vercel deploy
        id: deploy
        if: ${{ !inputs.transferred }}
        run: |
          URL=$(vercel deploy --prebuilt ${{ steps.vercel.outputs.deploy-flag }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $URL"
        shell: bash

      - name: Alias for stage
        id: alias
        if: ${{ !inputs.transferred && inputs.environment == 'stage' }}
        run: |
          STAGE_ALIAS="${GITHUB_REPOSITORY##*/}-stage.vercel.app"
          vercel alias set "${{ steps.deploy.outputs.url }}" "$STAGE_ALIAS" \
            --scope "${{ secrets.VERCEL_ORG_ID }}" \
            --token="${{ secrets.VERCEL_TOKEN }}"
        shell: bash

      - name: Comment deploy URL on PR
        if: ${{ !inputs.transferred && github.event_name == 'pull_request' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          DEPLOY_ENV: ${{ inputs.environment }}
        with:
          script: |
            const marker = '<!-- vercel-deploy-comment -->';
            const body = `${marker}\n**Vercel ${process.env.DEPLOY_ENV} deploy:** ${process.env.DEPLOY_URL}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # Keep this the last step: `always()` makes it run after a failed or
      # cancelled step too, so the deployment is not left `in_progress`.
      # Skipped when the start step created no deployment. The final state
      # comes from the deploy (and stage alias) outcome, not `job.status`, so a
      # failed PR comment doesn't record a live deploy as failed.
      - name: Finish GitHub deployment
        if: ${{ always() && !inputs.transferred && steps.gh-deployment.outputs.deployment-id != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          DEPLOYMENT_ID: ${{ steps.gh-deployment.outputs.deployment-id }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          ALIAS_OUTCOME: ${{ steps.alias.outcome }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const { finish } = require('./.platform/.github/scripts/github-deployment.cjs');
            await finish({ github, context, core });
