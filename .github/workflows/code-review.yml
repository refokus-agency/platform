name: Code review (reusable)

on:
  workflow_call:
    inputs:
      plugins:
        description: |
          Newline-separated list of Claude Code plugins to install. Newline-separated, NOT
          comma-separated — a comma-joined list is treated as one plugin name and fails to resolve.
        required: false
        type: string
        default: code-review@claude-code-plugins
      plugin-marketplaces:
        description: |
          Newline-separated list of Claude Code plugin marketplace Git URLs. Newline-separated,
          NOT comma-separated.
        required: false
        type: string
        default: https://github.com/anthropics/claude-code.git
      prompt:
        description: Instructions for Claude. Defaults to the code-review plugin's slash command against the current PR.
        required: false
        type: string
        default: /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
      allowed-tools:
        description: |
          Comma-separated tool allowlist passed to the Claude CLI as --allowedTools. The default is
          the union of the code-review plugin's own frontmatter allowlist plus the inline-comment
          MCP tool. Narrowing it to the MCP tool alone starves the review — it can no longer read
          the diff or post the summary comment.
        required: false
        type: string
        default: mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)
      track-progress:
        description: Force tag mode with a tracking comment on the PR.
        required: false
        type: boolean
        default: false
      fetch-depth:
        description: Checkout depth for the caller repo.
        required: false
        type: string
        default: '1'
      allowed-bots:
        description: |
          Comma-separated list of bot actors whose pull requests should still be reviewed, or '*'
          for every bot. Empty (the default) skips bot-authored pull requests green: their diffs
          are generated (release-please changelog bumps, Renovate lockfile churn), so a review
          spends tokens on output no human wrote. The `[bot]` suffix is optional in each entry.
        required: false
        type: string
        default: ''
      federation-rule-id:
        description: |
          Anthropic workload identity federation rule ID (fdrl_...). When set together with
          anthropic-org-id, the action exchanges the workflow's GitHub OIDC token instead of using
          a static API key. Requires the caller to grant id-token: write.
          Defaults to the caller's ANTHROPIC_FEDERATION_RULE_ID Actions variable, so setting it
          once at org level configures every repo with no per-caller wiring. Neither this nor
          anthropic-org-id is sensitive — they are identifiers, not credentials, which is why they
          are variables and inputs rather than secrets.
        required: false
        type: string
        default: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      anthropic-org-id:
        description: |
          Anthropic organization UUID, used with federation-rule-id. Defaults to the caller's
          ANTHROPIC_ORG_ID Actions variable.
        required: false
        type: string
        default: ${{ vars.ANTHROPIC_ORG_ID }}
    secrets:
      # required: false on purpose. A required secret would fail the run at startup for every
      # caller that hasn't configured it — including Dependabot and fork PRs, which never receive
      # secrets at all. The "Resolve auth" step below gates on the credential instead, so an
      # unconfigured caller skips green rather than failing red.
      ANTHROPIC_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

jobs:
  # Named for the action it performs, not for the workflow. GitHub renders a reusable's check as
  # `<caller job key> / <this job key>`, so reusing `code-review` here produced the useless
  # `code-review / code-review`. Matches the convention in the sibling reusables: ci.yml uses
  # `checks`, deploy.yml uses `deploy`, release.yml uses `publish`.
  review:
    runs-on: ubuntu-latest
    # No explicit permissions block on purpose: the job inherits the caller's
    # granted permissions. Declaring a scope here would force EVERY caller to
    # grant it or the run fails at startup. Callers need `contents: read`,
    # `pull-requests: write`, `issues: read` and `id-token: write`;
    # see examples/pr-code-review.yml.
    steps:
      - name: Resolve auth
        id: auth
        # The `secrets` context is not usable in a job-level `if:`, so the credential check runs
        # here and every later step gates on this step's output instead.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FEDERATION_RULE_ID: ${{ inputs.federation-rule-id }}
          ANTHROPIC_ORG_ID: ${{ inputs.anthropic-org-id }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ] \
            || [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] \
            || { [ -n "$FEDERATION_RULE_ID" ] && [ -n "$ANTHROPIC_ORG_ID" ]; }; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::[code-review] skipped: no Anthropic credential available. Configure the ANTHROPIC_API_KEY secret (or CLAUDE_CODE_OAUTH_TOKEN, or both the federation-rule-id and anthropic-org-id inputs). This is expected on Dependabot and fork pull requests, which never receive secrets."
          fi
        shell: bash

      - name: Resolve actor
        id: actor
        # Gated on the credential so an unconfigured caller never spends an API call here.
        if: steps.auth.outputs.ready == 'true'
        # Mirrors claude-code-action's own guard (src/github/validation/actor.ts): it resolves
        # the triggering actor's account type through the Users API and THROWS when the type is
        # not `User`, unless the actor matches its `allowed_bots` input. Pre-checking the same
        # condition here is what turns that hard failure into a green skip — without it every
        # bot-authored pull request (release-please, Renovate) fails red in every caller repo
        # that has a credential configured.
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOWED_BOTS: ${{ inputs.allowed-bots }}
        run: |
          normalize() {
            printf '%s' "$1" | tr '[:upper:]' '[:lower:]' | sed 's/\[bot\]$//'
          }

          # A 404 means a GitHub App actor with no backing user account, which the action also
          # treats as a bot. A transient API failure lands here too and skips the review rather
          # than failing the pull request — green is the safe direction for an advisory job.
          actor_type=$(gh api "users/${GITHUB_ACTOR}" --jq .type 2>/dev/null || echo 'Bot')

          if [ "$actor_type" = 'User' ]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          allowed=false
          trimmed=$(printf '%s' "$ALLOWED_BOTS" | tr -d '[:space:]')
          if [ "$trimmed" = '*' ]; then
            allowed=true
          elif [ -n "$trimmed" ]; then
            wanted=$(normalize "$GITHUB_ACTOR")
            IFS=','
            for bot in $trimmed; do
              if [ "$(normalize "$bot")" = "$wanted" ]; then
                allowed=true
                break
              fi
            done
            unset IFS
          fi

          if [ "$allowed" = true ]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "::notice::[code-review] skipped: pull request triggered by ${GITHUB_ACTOR} (account type: ${actor_type}), not a human. Set the allowed-bots input to review this bot's pull requests anyway."
          fi
        shell: bash

      - name: Checkout caller repo
        if: steps.auth.outputs.ready == 'true' && steps.actor.outputs.eligible == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ inputs.fetch-depth }}

      - name: Code review
        if: steps.auth.outputs.ready == 'true' && steps.actor.outputs.eligible == 'true'
        # Pinned literally: GitHub allows no expression in a step's `uses:`, so the ref cannot
        # be exposed as a workflow input. Bump it here when upstream cuts a new major.
        uses: anthropics/claude-code-action@v1
        with:
          prompt: ${{ inputs.prompt }}
          plugins: ${{ inputs.plugins }}
          plugin_marketplaces: ${{ inputs.plugin-marketplaces }}
          track_progress: ${{ inputs.track-progress }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_federation_rule_id: ${{ inputs.federation-rule-id }}
          anthropic_organization_id: ${{ inputs.anthropic-org-id }}
          allowed_bots: ${{ inputs.allowed-bots }}
          # v1 has no `allowed_tools` input — the allowlist reaches the CLI through claude_args.
          claude_args: ${{ inputs.allowed-tools != '' && format('--allowedTools "{0}"', inputs.allowed-tools) || '' }}
