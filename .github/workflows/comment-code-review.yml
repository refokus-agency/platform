# This repo dogfoods its own code-review reusable: comment `@claude review` on a pull request.
#
# This file always runs from the DEFAULT BRANCH, so it does NOT exercise a change to
# code-review.yml on a pull request's own branch — read
# docs/architecture.md#testing-a-change-to-code-reviewyml before using it that way.

name: Code Review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  # issues: write for the eyes reaction — see examples/comment-code-review.yml.
  issues: write
  # Mandatory — see the comment in examples/comment-code-review.yml.
  id-token: write

# No `concurrency:` here on purpose — the same rule every caller follows. Serialization is owned
# by the reusable, the only place that knows the trigger phrase. A block here would apply ON TOP
# OF the reusable's job-level group, take in every comment in the repo rather than just review
# requests, and silently kill queued reviews. See
# docs/architecture.md#why-serialization-lives-in-the-reusable-not-the-caller and the longer
# comment in examples/comment-code-review.yml.

jobs:
  code-review:
    uses: ./.github/workflows/code-review.yml
    secrets: inherit
