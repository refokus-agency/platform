name: Script tests

# Runs the tests of the scripts under .github/scripts that the reusables execute in
# consumer repos. Those scripts are fetched from `platform-ref` (default `main`) at run
# time, so a bug merged here reaches every caller without a release — this is the gate
# that stops it first.
#
# Every test stubs the GitHub API: nothing here needs a token or the network.

on:
  pull_request:

# Read-only, by design: pull_request runs for forks too, and nothing here writes.
permissions:
  contents: read

jobs:
  review-context:
    name: code-review context script
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # jq, yq and awk are preinstalled on ubuntu-latest; the tests need nothing else.
      - name: Test review-context.sh and the step that runs it
        run: ./.github/scripts/test-review-context.sh
