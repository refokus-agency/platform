version: 2
updates:
  # Reusable workflows under .github/workflows/.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # Composite actions need their own entry: the `github-actions` ecosystem does not
  # recurse into .github/actions/**, so without this the four pins in
  # .github/actions/setup/action.yml would silently never be updated.
  # A future composite action needs its entry added here by hand — see docs/dependabot.md.
  - package-ecosystem: "github-actions"
    directory: "/.github/actions/setup"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # The review browser of code-review.yml (@playwright/mcp and the exact Playwright alpha it pins),
  # installed with `npm ci` from this lockfile in a job that holds the Anthropic credential. The
  # cooldown keeps the "at least two weeks old" rule for version bumps; security updates are not
  # held back by it. A bump PR still needs the checks in
  # docs/architecture.md#the-preview-site-and-the-performance-note: tool names and flags still
  # exist, and a run through test/code-review-next before merging.
  - package-ecosystem: "npm"
    directory: "/.github/scripts/playwright-mcp"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
